# docker compose configuration for agentene/browser
#
#   build & start:   docker compose up -d --build
#   logs:            docker compose logs -f
#   stop:            docker compose down
#   shell access:    docker compose exec browser bash
#   rebuild only:    docker compose build
#
# Every runtime knob reads from a .env file next to this file (create it with
# `cp .env.example .env`): values there override the defaults baked in below
# via ${VAR:-default} substitution. Variables NOT listed under environment:
# still reach the container through the env_file pass-through (e.g. native
# SELKIES_* settings).
#
# Ports come in two independent sets, both settable in .env:
#   * CONTAINER side — what nginx listens on inside the container:
#     NGINX_LISTEN_HTTP_PORT (default 80, web HTTP), NGINX_LISTEN_HTTPS_PORT (default 443, web
#     HTTPS — only when ENABLE_HTTPS=true) and CDP_LISTEN_PORT (default 9222,
#     CDP). Change these e.g. with host networking (compose.host.yaml) or a
#     shared network namespace, or when sibling containers dial a specific
#     port.
#   * HOST side — what docker publishes: NGINX_HTTP_PORT / NGINX_HTTPS_PORT /
#     CDP_PORT, mapped onto the container-side ports above.
# The HTTPS port is not published at all by default; opt in via
# COMPOSE_FILE=compose.yaml:compose.https.yaml in .env (see
# compose.https.yaml) so a non-HTTPS setup does not occupy a host port.
#
# Host networking (the browser reaching apps on the host's localhost):
# COMPOSE_FILE=compose.yaml:compose.host.yaml in .env — see compose.host.yaml.
# For NETWORK_* (bridge mode only) see the networks: block at the bottom.
#
# The entrypoint starts everything in one container:
#   Xvfb (or labwc) -> PulseAudio -> Selkies (loopback) -> Chrome
#   (+ CDP gateway) -> nginx front door
#   nginx serves: NGINX_LISTEN_HTTP_PORT (web UI, HTTP)
#                 + NGINX_LISTEN_HTTPS_PORT (web UI, HTTPS, ENABLE_HTTPS=true)
#                 + CDP_LISTEN_PORT (chromium CDP endpoint)
#                 + one listener per PORT_FORWARDS entry (extra forwards to
#                   sibling containers on the same docker network — see the
#                   environment: section)

services:
  browser:
    build:
      context: .
      args:
        # Chrome for Testing build (autogenerated via ./update-chrome-node.mjs,
        # Stable channel; any CfT known-good version works)
        CHROME_VERSION: "${CHROME_VERSION:-157.0.8103.38}"
        # Node.js major version (autogenerated via ./update-chrome-node.mjs)
        NODE_VERSION: "${NODE_VERSION:-26}"
        # Selkies upstream release; its wheels (and the pixelflux/pcmflux
        # dependency wheels) are fetched from the GitHub releases
        SELKIES_VERSION: "${SELKIES_VERSION:-2.1.0}"
    image: agentene/browser:latest
    container_name: agentene-browser
    hostname: agentene-browser
    restart: always

    # Pass everything in .env through to the container as-is; covers variables
    # not explicitly listed under environment: below. `environment:` entries
    # (which read the same .env via substitution) win on conflict, so both
    # mechanisms always agree. Missing .env is not an error.
    env_file:
      - path: .env
        required: false

    # host port : container port. The container side follows the listen
    # ports configured under environment: below. The HTTPS port is
    # deliberately absent here; it is published by the compose.https.yaml
    # overlay.
    ports:
      - "${NGINX_HTTP_PORT:-8080}:${NGINX_LISTEN_HTTP_PORT:-80}" # web UI, HTTP (always on)
      - "${CDP_PORT:-9222}:${CDP_LISTEN_PORT:-9222}" # chromium CDP endpoint

    volumes:
      # Browser data persisted on the host: the profile (user-data/: cookies,
      # logins, extensions) and the CDP gateway's profile clones
      # (contexts/). One mount for both, so on an XFS/btrfs host the clones
      # are instant reflinks instead of full copies.
      - "${BROWSER_DATA_HOST_DIR:-./browser}:/browser"
      # The TLS certificate mount (./tls) lives in compose.https.yaml, so a
      # setup without HTTPS does not get an empty ./tls created by docker.

    environment:

      # --- Service toggles ---
      # Set either to "false" to skip that group of services
      ENABLE_SELKIES: "${ENABLE_SELKIES:-true}"
      ENABLE_CDP: "${ENABLE_CDP:-true}"

      # --- nginx front door ---
      # Ports nginx LISTENS ON inside the container (not the published host
      # ports — those are NGINX_HTTP_PORT / NGINX_HTTPS_PORT / CDP_PORT).
      NGINX_LISTEN_HTTP_PORT: "${NGINX_LISTEN_HTTP_PORT:-80}" # web UI, HTTP
      NGINX_LISTEN_HTTPS_PORT: "${NGINX_LISTEN_HTTPS_PORT:-443}" # web UI, HTTPS
      CDP_LISTEN_PORT: "${CDP_LISTEN_PORT:-9222}" # public CDP endpoint
      # Address every nginx listener binds to; empty = all interfaces. Mainly
      # for the compose.host.yaml overlay (no port mapping there to restrict
      # exposure): 127.0.0.1 keeps the unauthenticated CDP endpoint and the
      # web UI host-local.
      NGINX_LISTEN_ADDR: "${NGINX_LISTEN_ADDR:-}"
      # true = nginx also serves HTTPS on NGINX_LISTEN_HTTPS_PORT (published to the
      # host only via the compose.https.yaml overlay, which also mounts ./tls).
      # Certificates: an existing valid pair in ./tls is reused as-is;
      # otherwise a self-signed pair is generated once and then reused.
      ENABLE_HTTPS: "${ENABLE_HTTPS:-false}"
      #TLS_SELF_SIGNED_CN: "localhost" # CN of the generated self-signed certificate

      # --- Extra port forwards (docker network) ---
      # Space/comma-separated LISTEN=HOST:PORT entries: nginx also listens on
      # each LISTEN port inside this container and reverse-proxies it
      # (WebSocket-capable) to HOST:PORT — typically a sibling container on
      # the same docker network, addressed by container name. The peer is
      # resolved per request, so this container starts even while the peer is
      # still down. The peer's port must be one it binds on its network
      # address, not something it keeps on its own loopback (e.g. a sibling
      # app container may serve its GUI on :80 network-wide while keeping
      # an internal :3080 bound to its own loopback only).
      # Example (reach container web's GUI at
      # http://localhost:3080 inside this container):
      #PORT_FORWARDS: "3080=web:80"
      PORT_FORWARDS: "${PORT_FORWARDS:-}"

      # --- Selkies ---
      # Set a password to enable the login screen (username defaults to
      # "ubuntu"; override with SELKIES_BASIC_AUTH_USER). Empty = no login.
      SELKIES_BASIC_AUTH_PASSWORD: "${SELKIES_BASIC_AUTH_PASSWORD:-}"
      # h264enc (default) | h264enc-striped | openh264enc | jpeg
      SELKIES_ENCODER: "${SELKIES_ENCODER:-h264enc}"
      # URL path prefix the web UI is served under, e.g. "/desk" ->
      # http://host:port/desk/ (slashes optional; empty = site root). An
      # outer reverse proxy mounting it at a subpath must forward the path
      # UNCHANGED (no prefix stripping). / and /desk redirect to /desk/.
      SELKIES_SUBFOLDER: "${SELKIES_SUBFOLDER:-}"
      # Extra CLI flags passed to `selkies`
      SELKIES_EXTRA_ARGS: "${SELKIES_EXTRA_ARGS:-}"

      # --- Chromium / CDP ---
      # 0 (default) = headed on the desktop, visible in the Selkies stream;
      # 1 = headless, desktop stays empty
      CHROMIUM_HEADLESS: "${CHROMIUM_HEADLESS:-0}"
      # Browser UI locale + Accept-Language (default English; e.g. zh-CN)
      CHROMIUM_LANG: "${CHROMIUM_LANG:-en-US}"
      # Page opened at startup, e.g. "https://example.com"
      CHROMIUM_START_URL: "${CHROMIUM_START_URL:-about:blank}"
      # Extra chromium flags, e.g. "--proxy-server=http://host:3128"
      CHROMIUM_EXTRA_ARGS: "${CHROMIUM_EXTRA_ARGS:-}"
      # GPU/rendering policy (default owned by the entrypoint, so it also
      # applies without compose): auto = hardware GL when a GPU is passed in
      # via the compose.gpu.yaml / compose.gpu-nvidia.yaml overlay, else
      # SwiftShader software; off = force software; strict = never
      # SwiftShader (WebGL then requires the GPU).
      CHROMIUM_GPU: "${CHROMIUM_GPU:-auto}"
      # Comma-separated chromium features disabled via --disable-features=.
      # Default turns off the HTTPS-First / HTTPS-Upgrade experiments so plain
      # http:// pages are not auto-upgraded (typical for CDP automation
      # against internal/intercepted sites). Overridable in .env; set it to an
      # EMPTY value there (CHROMIUM_DISABLE_FEATURES=) to drop the flag.
      CHROMIUM_DISABLE_FEATURES: "${CHROMIUM_DISABLE_FEATURES-HttpsFirstBalancedModeAutoEnable,HttpsUpgrades,HttpsFirstModeV2}"
      # Browser profile; inside the /browser mount so logins, cookies and
      # extensions survive container recreation
      CHROMIUM_USER_DATA_DIR: "${CHROMIUM_USER_DATA_DIR:-/browser/user-data}"

      # --- CDP gateway ---
      # true = every isolated CDP context (browser.newContext(), playwright-cli
      # "isolated": true) gets its own chromium on a clone of the profile above:
      # inherits its logins, shares nothing back; destroyed when the context
      # closes. Dashboard: http://host:${CDP_PORT}/console/
      ENABLE_CDP_GATEWAY: "${ENABLE_CDP_GATEWAY:-false}"
      # Most isolated contexts alive at once (each is a whole browser)
      CDP_CONTEXTS_MAX: "${CDP_CONTEXTS_MAX:-4}"
      # 1 = context browsers run headless; empty = same as CHROMIUM_HEADLESS
      CDP_CONTEXTS_HEADLESS: "${CDP_CONTEXTS_HEADLESS:-}"
      # One profile-cloned browser per isolated context lives here (wiped at
      # every start); keep it on the /browser mount next to the profile so
      # the clones can be reflinks
      CDP_CONTEXTS_DIR: "${CDP_CONTEXTS_DIR:-/browser/contexts}"

      # --- Desktop ---
      # Desktop the headed browsers live on: x11 = Xvfb (+ picom); wayland =
      # labwc, a headless Wayland compositor + window manager that Selkies
      # captures on the GPU (with the compose.gpu.yaml overlay: several times
      # less CPU for animated pages; no gain without a GPU, keep x11 with
      # NVIDIA). SCREEN_GEOMETRY_MAX, ENABLE_COMPOSITOR and
      # CHROMIUM_FOLLOW_SCREEN below are X11-only.
      DISPLAY_BACKEND: "${DISPLAY_BACKEND:-x11}"
      # Xvfb screen geometry WxHxD (wayland: labwc's output size); also sizes
      # the Selkies stream
      SCREEN_GEOMETRY: "${SCREEN_GEOMETRY:-1920x1080x24}"
      # RandR ceiling WxHxD the Xvfb screen is created at, so Selkies'
      # dynamic resize (browser window size -> virtual display resolution)
      # can grow past SCREEN_GEOMETRY; the working size is preset back in
      # at startup. Empty = the fixed screen of SCREEN_GEOMETRY (no colon:
      # an explicitly empty value stays empty and disables the headroom).
      SCREEN_GEOMETRY_MAX: "${SCREEN_GEOMETRY_MAX-8192x4096x24}"
      # Run a compositing manager (picom) on the Xvfb display. Without one
      # chromium drops the alpha-blended shadows of its popup windows, so
      # the right-click context menu shows up as a seemingly borderless
      # white sheet on light pages. false = the old flat look.
      ENABLE_COMPOSITOR: "${ENABLE_COMPOSITOR:-true}"
      # Keep the headed chromium window covering the whole display when the
      # screen is resized (Selkies' browser-driven resize); no window manager
      # runs on Xvfb to do it. false = the window keeps its startup size.
      CHROMIUM_FOLLOW_SCREEN: "${CHROMIUM_FOLLOW_SCREEN:-true}"
      # Wayland only: keep the browser windows (main + CDP contexts) maximized
      # with tab strip and address bar — no minimize/maximize buttons, no
      # tab strip double-click, no dragging windows or their edges, and the
      # context menu's Minimize/Restore are undone right away. false =
      # labwc's default bindings (a double-click un-maximizes).
      CHROMIUM_LOCK_WINDOWS: "${CHROMIUM_LOCK_WINDOWS:-true}"

      # --- Privilege drop ---
      # Run the desktop stack (Xvfb/labwc, picom, PulseAudio, selkies, chromium,
      # the CDP gateway) and the nginx WORKERS as this user instead of root. Empty (default)
      # = everything runs as root (the historical behavior). Accepts an
      # existing username (e.g. browser, which the image ships) or uid[:gid]
      # — missing passwd/group entries for a numeric id are synthesized at
      # startup, and the browser profile mount is chowned to the user on
      # every start. PID 1 and the nginx master always stay root: nginx
      # binds the (by default privileged) listen ports and reads the TLS key.
      RUN_USER: "${RUN_USER:-}"

    healthcheck:
      # The web UI on container port NGINX_LISTEN_HTTP_PORT counts as healthy
      # once Selkies answers through nginx: 200, a 302 to SELKIES_SUBFOLDER,
      # or 401 when the login screen is on (502 = Selkies not up). With
      # ENABLE_SELKIES=false there is no web listener, so the CDP endpoint is
      # probed instead. A dead service is caught by the entrypoint itself (it
      # exits and docker restarts the container). $$ = evaluated in the
      # container at check time, not by compose.
      test:
        - CMD-SHELL
        - >-
          if [ "$${ENABLE_SELKIES:-true}" = false ]; then
          curl -sf -o /dev/null http://127.0.0.1:${CDP_LISTEN_PORT:-9222}/json/version;
          else
          case "$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:${NGINX_LISTEN_HTTP_PORT:-80}/)" in
          2??|3??|401) true ;; *) false ;; esac;
          fi
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# Docker network the container attaches to. Defaults to compose's own
# "<project>_default" network, so nothing changes until NETWORK_NAME is set
# in .env:
#   NETWORK_NAME=my-net NETWORK_EXTERNAL=false  compose creates/manages my-net
#                                               (removed again by `down`)
#   NETWORK_NAME=existing NETWORK_EXTERNAL=true  attach to a network that
#                                               already exists (e.g. shared
#                                               with a reverse proxy stack);
#                                               compose never creates or
#                                               removes it
# For a pre-existing network prefer the explicit NETWORK_EXTERNAL=true: recent
# compose versions also adopt an existing network with NETWORK_EXTERNAL=false
# (and never delete a network they did not create), but older versions refuse
# with an "incorrect label" error instead.
networks:
  default:
    name: "${NETWORK_NAME:-${COMPOSE_PROJECT_NAME:-agentene-browser}_default}"
    external: "${NETWORK_EXTERNAL:-false}"
