# CI for the agentene/browser image.
#
#   lint        : hadolint + docker build --check (Dockerfile), shellcheck
#                 (entrypoint), node --check, py_compile (python helpers)
#   verify      : docker build + runtime smoke tests (CDP endpoint, Selkies web,
#                 CDP gateway, Wayland desktop)
#   release-tag : on merges to main that change the CHROME_VERSION pin —
#                 pushes tag v<chrome-version> (or ...-r2, -r3, ... if taken),
#                 which re-triggers this workflow's publish job
#   publish     : on `v*` tags and manual dispatch — pushes to GHCR (always) and
#                 Docker Hub (when DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are set; same
#                 <owner>/<repo> path as GHCR)
#
# Together with chrome-update.yaml (daily Chrome for Testing watch) this
# closes the loop: upstream release -> re-pin PR -> CI here -> auto-merge ->
# tag -> publish. See README "Automatic upstream updates".
#
# Required secrets for Docker Hub publishing (GHCR needs none, it uses the
# built-in GITHUB_TOKEN): DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: browser

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: hadolint (Dockerfile)
        run: |
          docker run --rm -i \
            -e HADOLINT_CONFIG=/.hadolint.yaml \
            -v "$PWD/.hadolint.yaml:/.hadolint.yaml" \
            hadolint/hadolint:v2.12.0 < Dockerfile

      - name: shellcheck (docker-entrypoint.sh + entrypoint/)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 \
            docker-entrypoint.sh entrypoint/lib/*.sh entrypoint/helpers/*.sh

      - name: syntax check (node scripts, entrypoint python helpers)
        run: |
          node --check update-chrome-node.mjs
          node --check cdp-gateway/gateway.mjs
          node --check cdp-gateway/panel.js
          python3 -m py_compile entrypoint/helpers/*.py

      - name: docker build --check (Dockerfile lint, BuildKit)
        run: docker build --check .

  verify:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: localhost/ci:${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — chromium CDP endpoint
        run: |
          set -euo pipefail
          docker run -d --name cdp-smoke -p 9222:9222 \
            -e ENABLE_SELKIES=false localhost/ci:${{ env.IMAGE_NAME }}
          trap 'docker logs cdp-smoke || true; docker rm -f cdp-smoke >/dev/null' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9222/json/version && break
            sleep 1
          done
          echo
          curl -sf http://127.0.0.1:9222/json/version \
            | jq -e '.Browser and .webSocketDebuggerUrl' >/dev/null \
            && echo "CDP smoke test OK"

      - name: Smoke test — Selkies web UI
        run: |
          set -euo pipefail
          docker run -d --name web-smoke -p 8080:80 \
            -e ENABLE_CDP=false localhost/ci:${{ env.IMAGE_NAME }}
          trap 'docker logs web-smoke || true; docker rm -f web-smoke >/dev/null' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ | grep -qi '<html' \
            && echo "web UI smoke test OK"

      - name: Smoke test — CDP gateway
        run: |
          set -euo pipefail
          docker run -d --name gateway-smoke -p 9223:9222 \
            -e ENABLE_SELKIES=false -e ENABLE_CDP_GATEWAY=true \
            localhost/ci:${{ env.IMAGE_NAME }}
          trap 'docker exec gateway-smoke cat /tmp/cdp-gateway.log || true; docker logs gateway-smoke || true; docker rm -f gateway-smoke >/dev/null' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9223/json/version >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9223/json/version \
            | jq -e '.webSocketDebuggerUrl | startswith("ws://127.0.0.1:9223/")' >/dev/null
          # an isolated context must get its own chromium and be
          # destroyed again on dispose; driven with raw CDP from the image's node
          docker exec -i gateway-smoke node --input-type=module - <<'EOF'
          const v = await (await fetch('http://127.0.0.1:9222/json/version')).json();
          const ws = new WebSocket(v.webSocketDebuggerUrl);
          await new Promise((r) => { ws.onopen = r; });
          let id = 0; const pending = new Map();
          ws.onmessage = (e) => { const m = JSON.parse(e.data); pending.get(m.id)?.(m); };
          const send = (method, params = {}, sessionId) => new Promise((r) => { pending.set(++id, r); ws.send(JSON.stringify({ id, method, params, sessionId })); });
          const contexts = async () => (await (await fetch('http://127.0.0.1:9222/console/api')).json()).contexts;
          await send('Target.setAutoAttach', { autoAttach: true, waitForDebuggerOnStart: false, flatten: true });
          const ctx = await send('Target.createBrowserContext', { disposeOnDetach: true });
          if (!ctx.result?.browserContextId?.startsWith('CONTEXT')) throw new Error(`no context: ${JSON.stringify(ctx)}`);
          const page = await send('Target.createTarget', { url: 'about:blank', browserContextId: ctx.result.browserContextId });
          if (!page.result?.targetId) throw new Error(`createTarget failed: ${JSON.stringify(page)}`);
          if ((await contexts()).length !== 1) throw new Error('context not listed');
          // Playwright's newCDPSession: attach on a browser-target session
          const bs = (await send('Target.attachToBrowserTarget')).result.sessionId;
          const att = await send('Target.attachToTarget', { targetId: page.result.targetId, flatten: true }, bs);
          if (!att.result?.sessionId) throw new Error(`attach via browser session failed: ${JSON.stringify(att)}`);
          const ev = await send('Runtime.evaluate', { expression: '6*7' }, att.result.sessionId);
          if (ev.result?.result?.value !== 42) throw new Error(`evaluate on attached session failed: ${JSON.stringify(ev)}`);
          await send('Target.disposeBrowserContext', { browserContextId: ctx.result.browserContextId });
          await new Promise((r) => setTimeout(r, 1000));
          if ((await contexts()).length !== 0) throw new Error('context not destroyed');
          ws.close();
          console.log('CDP gateway smoke test OK');
          EOF

      - name: Smoke test — CDP console sidebar on the web UI
        run: |
          set -euo pipefail
          docker run -d --name panel-smoke -p 9225:9222 -p 8082:80 \
            -e ENABLE_CDP_GATEWAY=true -e SELKIES_BASIC_AUTH_PASSWORD=pw \
            localhost/ci:${{ env.IMAGE_NAME }}
          trap 'docker exec panel-smoke cat /tmp/cdp-gateway.log /tmp/nginx/error.log || true; docker logs panel-smoke || true; docker rm -f panel-smoke >/dev/null' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9225/json/version >/dev/null \
              && curl -sf -u ubuntu:pw http://127.0.0.1:8082/ >/dev/null && break
            sleep 1
          done
          # the entry page carries the sidebar script, served by the gateway
          curl -sf -u ubuntu:pw http://127.0.0.1:8082/ | grep -q 'cdp-console/panel.js'
          curl -sf -u ubuntu:pw http://127.0.0.1:8082/cdp-console/panel.js | grep -q '__cdpConsolePanel'
          # its API takes the master password only, without a login prompt
          curl -sf -u ubuntu:pw http://127.0.0.1:8082/cdp-console/api | jq -e '.main' >/dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' -u ubuntu:wrong http://127.0.0.1:8082/cdp-console/api)" = 401 ]
          ! curl -sI -u ubuntu:wrong http://127.0.0.1:8082/cdp-console/api | grep -qi '^www-authenticate'
          # writes need the X-CDP-Console header
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -u ubuntu:pw http://127.0.0.1:8082/cdp-console/api/nope)" = 403 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H 'X-CDP-Console: 1' -u ubuntu:pw http://127.0.0.1:8082/cdp-console/api/nope)" = 404 ]
          # the CDP port's console is unchanged (and cannot forge the marker)
          curl -sf http://127.0.0.1:9225/console/api | jq -e '.main' >/dev/null
          curl -sf -H 'X-CDP-Console-Via: web' http://127.0.0.1:9225/console/api | jq -e '.main' >/dev/null
          echo "CDP console sidebar smoke test OK"

      - name: Smoke test — Wayland desktop (DISPLAY_BACKEND=wayland)
        run: |
          set -euo pipefail
          docker run -d --name wayland-smoke -p 9224:9222 -p 8081:80 \
            -e DISPLAY_BACKEND=wayland localhost/ci:${{ env.IMAGE_NAME }}
          trap 'docker exec wayland-smoke cat /tmp/labwc.log || true; docker logs wayland-smoke || true; docker rm -f wayland-smoke >/dev/null' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9224/json/version >/dev/null \
              && curl -sf http://127.0.0.1:8081/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9224/json/version | jq -e '.Browser' >/dev/null
          curl -sf http://127.0.0.1:8081/ | grep -qi '<html'
          # the headed main browser must be a window of labwc (no X server)
          docker exec wayland-smoke sh -c \
            'XDG_RUNTIME_DIR=/tmp WAYLAND_DISPLAY="$(cat /tmp/labwc-display)" wlrctl toplevel list' \
            | grep -q '^cdp-main:'
          docker exec wayland-smoke sh -c '! pgrep -x Xvfb'
          echo "Wayland smoke test OK"

  release-tag:
    # When a merge to main changes the pinned CHROME_VERSION, tag the new
    # version so the publish job releases it (the tag push re-triggers ci.yaml
    # with refs/tags/v*, where the publish job runs). Runs after verify so a
    # broken image is never tagged. Manual bumps to main release the same way.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # job-level permissions replace the workflow-level ones; this job only
      # pushes a git tag, it does not touch packages.
      contents: write
    env:
      # The tag MUST be pushed with the PAT: events created by the built-in
      # GITHUB_TOKEN never trigger workflow runs, so a GITHUB_TOKEN-pushed tag
      # would leave the publish job dead. Without the PAT the tag is still
      # created, but publishing then needs a manual trigger.
      HAS_PAT: ${{ secrets.CHROME_UPDATE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # HEAD~1 needed to diff the incoming change
          token: ${{ secrets.CHROME_UPDATE_TOKEN || github.token }}

      - name: Tag the new Chrome pin (v<chrome-version>, -r2, -r3, ... if taken)
        run: |
          set -euo pipefail
          BEFORE="$(git rev-parse --verify -q HEAD~1 || true)"
          if [ -z "$BEFORE" ]; then
            echo "no parent commit to diff against — skipping"
            exit 0
          fi
          if ! git diff "$BEFORE" HEAD -- Dockerfile \
              | grep -qE '^[-+]ARG CHROME_VERSION='; then
            echo "CHROME_VERSION pin unchanged — nothing to release"
            exit 0
          fi
          VER="$(grep -m1 '^ARG CHROME_VERSION=' Dockerfile | cut -d= -f2)"
          [ -n "$VER" ] || { echo "ERROR: cannot read CHROME_VERSION"; exit 1; }
          BASE="v${VER}"
          # v<chrome-version> first; if that tag exists (re-release of the
          # same Chrome version), increment a -r2, -r3, ... suffix.
          EXISTING="$(git ls-remote --tags origin | cut -f2 | sed 's/\^{}$//')"
          TAG="$BASE"; N=1
          while printf '%s\n' "$EXISTING" | grep -qxF "refs/tags/${TAG}"; do
            N=$((N + 1))
            TAG="${BASE}-r${N}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release Chrome for Testing ${VER}"
          git push origin "$TAG"
          echo "pushed ${TAG} — the tag push triggers the publish job"
          if [ "${HAS_PAT}" != "true" ]; then
            echo "::warning::CHROME_UPDATE_TOKEN is not set, so this tag was pushed with GITHUB_TOKEN and the publish job will NOT auto-trigger. Re-push the tag from a machine (git push origin :refs/tags/${TAG} && git tag -f ... && git push origin ${TAG}) or run ci.yaml manually."
          fi

  publish:
    runs-on: ubuntu-latest
    needs: verify
    # Only publish version tags and manual runs; plain branch pushes are
    # already covered by the verify job above.
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    # Bind secrets to env so step-level `if` can reference them (the secrets
    # context is not available in steps[*].if).
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Compute image list (GHCR always, Docker Hub when configured)
        id: images
        run: |
          set -euo pipefail
          {
            echo "images<<EOI"
            echo "ghcr.io/${GITHUB_REPOSITORY,,}"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              echo "docker.io/${GITHUB_REPOSITORY,,}"
            fi
            echo "EOI"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.images }}
          # Tags follow the Chrome version (4 parts, not semver):
          # v150.0.7871.100 -> 150.0.7871.100 + 150; v150.0.7871.100-r2 ->
          # 150.0.7871.100-r2 + 150.
          tags: |
            type=match,pattern=^v(\d+(\.\d+)*(-r\d+)?)$,group=1
            type=match,pattern=^v(\d+)\.,group=1
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
