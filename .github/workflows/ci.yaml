      - name: Smoke test — X11 desktop (DISPLAY_BACKEND=x11)
        run: |
          set -euo pipefail
          docker run -d --name x11-smoke -p 9227:9222 -p 8083:80 \
            -e DISPLAY_BACKEND=x11 localhost/ci:${{ env.IMAGE_NAME }}
          trap 'docker exec x11-smoke cat /tmp/xvfb.log || true; docker logs x11-smoke || true; docker rm -f x11-smoke >/dev/null' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9227/json/version >/dev/null \
              && curl -s -o /dev/null http://127.0.0.1:8083/ && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9227/json/version | jq -e '.Browser' >/dev/null
          curl -s http://127.0.0.1:8083/ | grep -ci '<html' >/dev/null
          # the headed main browser must run on Xvfb (no labwc)
          docker exec x11-smoke pgrep -x Xvfb >/dev/null
          docker exec x11-smoke sh -c '! pgrep -x labwc'
          echo "X11 smoke test OK"

      - name: Smoke test — bounded desktop background buffers, resizing and input
        run: |
          set -euo pipefail
          for backend in wayland x11; do
            name="background-${backend}-smoke"
            docker run -d --name "$name" --shm-size=64m \
              -e DISPLAY_BACKEND="$backend" -e ENABLE_CDP=false -e ENABLE_AUTH=false -e WAYLAND_DEBUG=client \
              localhost/ci:${{ env.IMAGE_NAME }}
            trap 'docker logs "$name" || true; docker cp "$name":/tmp/desktop-background.log /tmp/background-smoke.log && cat /tmp/background-smoke.log; docker rm -f "$name" >/dev/null' EXIT
            for _ in $(seq 1 60); do
              docker exec "$name" curl -sf --unix-socket /tmp/agentene/selkies.sock \
                http://selkies/ >/dev/null 2>&1 && break
              sleep 1
            done
            if [ "$backend" = wayland ]; then
              # Read back real pixels as well as protocol buffer sizes. This capture tool is installed only in the disposable test container.
              docker exec -e DEBIAN_FRONTEND=noninteractive "$name" sh -c 'apt-get update >/dev/null && apt-get install -y --no-install-recommends grim >/dev/null'
            fi
            docker exec -i "$name" python3 - < .github/tests/desktop-background.py
            docker exec "$name" curl -sf --unix-socket /tmp/agentene/selkies.sock \
              http://selkies/ >/dev/null
            [ "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' "$name")" = 'true 0' ]
            docker rm -f "$name" >/dev/null
            trap - EXIT
          done

  release-tag:
    # Two kinds of release, told apart by what a merge to main changed:
    #   * code release   — VERSION changed (typically a dev -> main merge):
    #                      pushes git tag v<VERSION>, e.g. v0.2.0. Wins when
    #                      the same merge also moved the Chrome pin.
    #   * Chrome release — only the ARG CHROME_VERSION pin changed (the daily
    #                      chrome-update.yaml bump): NO git tag — a Chrome
    #                      bump re-pins a dependency, it is not a code
    #                      release. The job only reports kind=chrome, and
    #                      publish tags the image <VERSION>-<chrome-version>,
    #                      e.g. 0.2.0-151.0.7922.50, in the same run —
    #                      VERSION stays, the suffix records the Chrome
    #                      rebuild.
    # A code-release tag is pushed with the built-in GITHUB_TOKEN, whose
    # events trigger no workflow run — publish picks the release up from
    # this job's outputs in the same run instead (no PAT needed, no double
    # build). Runs after verify so a broken image is never released.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # job-level permissions replace the workflow-level ones; this job only
      # pushes a git tag (code releases), it does not touch packages.
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      kind: ${{ steps.tag.outputs.kind }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # HEAD~1 needed to diff the incoming change

      - name: Cut the release (code releases tag v<VERSION>, Chrome bumps are image-only)
        id: tag
        run: |
          set -euo pipefail
          BEFORE="$(git rev-parse --verify -q HEAD~1 || true)"
          if [ -z "$BEFORE" ]; then
            echo "no parent commit to diff against — skipping"
            exit 0
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          CHROME="$(grep -m1 '^ARG CHROME_VERSION=' Dockerfile | cut -d= -f2)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "ERROR: VERSION is not X.Y.Z: '${VERSION}'"; exit 1; }
          [[ "$CHROME" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "ERROR: cannot read CHROME_VERSION: '${CHROME}'"; exit 1; }
          if ! git diff --quiet "$BEFORE" HEAD -- VERSION; then
            # code release — the only kind that gets a git tag
            TAG="v${VERSION}"
            MSG="Release ${VERSION} (Chrome for Testing ${CHROME})"
            HINT="bump VERSION to release this change"
          elif git diff "$BEFORE" HEAD -- Dockerfile \
                 | grep -qE '^[-+]ARG CHROME_VERSION='; then
            # Chrome bump — no git tag: publish tags the image
            # <VERSION>-<chrome> straight from this job's kind output. No
            # released-once marker needed: the automatic bump only merges
            # when the pin moves, and re-publishing an identical
            # <VERSION>-<chrome> image is harmless.
            echo "kind=chrome" >> "$GITHUB_OUTPUT"
            echo "::notice::Chrome bump — publishing image ${VERSION}-${CHROME} without a git tag (the publish job builds it next)"
            exit 0
          else
            echo "::notice::VERSION and CHROME_VERSION pin unchanged — nothing released (bump VERSION to release a code change)"
            exit 0
          fi
          # A git tag is immutable: each v<VERSION> is released once.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::warning::${TAG} already exists — ${HINT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$MSG"
          git push origin "$TAG"
          echo "kind=code" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "pushed ${TAG} — the publish job builds it next"

  cleanup-update-branch:
    # Once chrome-update.yaml's bump PR is merged, delete its head branch
    # (chore/chrome-update). create-pull-request's delete-branch only removes
    # it on a later run that finds no diff, and the repo's "Automatically
    # delete head branches" setting may be off. Independent of verify: the PR
    # is merged either way, and the next bump recreates the branch from main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # delete the branch ref
      pull-requests: read # map the pushed commit to its merged PR
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: chore/chrome-update
    steps:
      - name: Delete the merged chore/chrome-update branch
        run: |
          set -euo pipefail
          # Only act when this push IS the merge of a PR from that branch
          # (same repo); print the PR's head sha so we can compare below.
          # shellcheck disable=SC2016 # $ENV is jq's, not the shell's
          PR_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[] | select(.merged_at != null
                             and .head.ref == $ENV.BRANCH
                             and .head.repo.full_name == $ENV.GITHUB_REPOSITORY)
                      | .head.sha' | head -n1)"
          if [ -z "$PR_HEAD" ]; then
            echo "${GITHUB_SHA} is not a merged ${BRANCH} PR — nothing to clean up"
            exit 0
          fi
          TIP="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" \
            --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$TIP" ]; then
            echo "${BRANCH} is already gone"
            exit 0
          fi
          # A newer chrome-update run may already have re-pushed the branch
          # (and opened a fresh PR) — deleting it then would close that PR.
          if [ "$TIP" != "$PR_HEAD" ]; then
            echo "${BRANCH} moved on (${TIP} != merged head ${PR_HEAD}) — keeping it"
            exit 0
          fi
          OPEN="$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number --jq length)"
          if [ "$OPEN" != "0" ]; then
            echo "${BRANCH} still has an open PR — keeping it"
            exit 0
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
          echo "deleted ${BRANCH} (merged at ${GITHUB_SHA})"

  publish:
    runs-on: ubuntu-latest
    needs: [verify, release-tag]
    # Publish only what main released:
    #   * a main push where release-tag just cut a release — a code release
    #     (git tag pushed) or a tagless Chrome bump (kind=chrome),
    #   * a hand-pushed `v*` tag (checked below to sit on main),
    #   * a manual dispatch of main (no tag -> sha-<short> only).
    # !cancelled() lets it run while release-tag is skipped (tag runs).
    if: >
      !cancelled() && needs.verify.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main'
          && (needs.release-tag.outputs.tag != '' || needs.release-tag.outputs.kind == 'chrome')) ||
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    timeout-minutes: 60
    # Bind secrets to env so step-level `if` can reference them (the secrets
    # context is not available in steps[*].if).
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # The git release tag: from release-tag (code release on main) or the
      # pushed tag itself. A Chrome bump releases without one.
      RELEASE_TAG: ${{ needs.release-tag.outputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: the on-main check below

      - uses: docker/setup-buildx-action@v4

      - name: Check the release against VERSION + the Chrome pin
        id: release
        env:
          # release-tag's verdict for a main push: 'code', 'chrome' or ''
          # (empty on tag pushes and manual dispatches).
          KIND: ${{ needs.release-tag.outputs.kind }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          CHROME="$(grep -m1 '^ARG CHROME_VERSION=' Dockerfile | cut -d= -f2)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${VERSION}-${CHROME}" >> "$GITHUB_OUTPUT"
          # Releases come from main only — refuse a tag pushed on dev or a
          # feature branch.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${GITHUB_SHA} is not on main — only commits merged to main are released"
            exit 1
          fi
          if [ -n "${RELEASE_TAG}" ]; then
            # A git tag (code release from release-tag, or hand-pushed):
            # must be v<VERSION> or v<VERSION>-<chrome> of this commit.
            case "${RELEASE_TAG}" in
              "v${VERSION}") KIND=code ;;
              "v${VERSION}-${CHROME}") KIND=chrome ;;
              *)
                echo "::error::tag ${RELEASE_TAG} does not match this commit (expected v${VERSION} or v${VERSION}-${CHROME}); release tags are v<X.Y.Z> or v<X.Y.Z>-<chrome-version>"
                exit 1 ;;
            esac
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "releasing git tag ${RELEASE_TAG} (${KIND} release)"
          elif [ "${KIND}" = "chrome" ]; then
            # The daily Chrome bump merged to main: no git tag — the image
            # tags below are the release.
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "releasing Chrome bump ${VERSION}-${CHROME} (image tags only, no git tag)"
          else
            echo "no release tag — publishing sha-<short> only"
          fi

      - name: Compute image list (GHCR always, Docker Hub when configured)
        id: images
        run: |
          set -euo pipefail
          {
            echo "images<<EOI"
            echo "ghcr.io/${GITHUB_REPOSITORY,,}"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              echo "docker.io/${GITHUB_REPOSITORY,,}"
            fi
            echo "EOI"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.images }}
          # A release (either kind, checked above) publishes
          #   <VERSION>-<chrome-version>  e.g. 0.2.0-150.0.7871.100 (the Chrome
          #                               pinned at that commit)
          #   <VERSION>                   e.g. 0.2.0
          #   latest
          # A code release also carries the git tag v<VERSION>; a Chrome
          # release (the daily bump) has no git tag — these image tags are
          # its only artifact. No sha-<short> (priority=1000:
          # <VERSION>-<chrome-version> becomes the OCI version label). Only a
          # tagless manual run on main publishes sha-<short>, and nothing
          # else.
          tags: |
            type=raw,value=${{ steps.release.outputs.build }},enable=${{ steps.release.outputs.release == 'true' }},priority=1000
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.release == 'true' }}
            type=sha,enable=${{ steps.release.outputs.release != 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
