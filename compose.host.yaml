# Optional overlay: run the container on the HOST network stack
# (network_mode: host), so the browser reaches services on the host directly
# — e.g. a web app you are developing on http://localhost:3000.
#
#   cp .env.example .env
#   # in .env (keep this overlay LAST when combining with other overlays):
#   COMPOSE_FILE=compose.yaml:compose.host.yaml
#   docker compose up -d
#
# What changes with host networking:
#   * there is no port publishing — this overlay drops the ports: list and
#     nginx binds the same three access ports directly on the host:
#       HTTP_PORT=8080, HTTPS_PORT=8443, CDP_PORT=9222.
#     URLs stay the same when switching modes. HTTPS needs ENABLE_HTTPS=true;
#     to also mount ./tls, add compose.https.yaml before this overlay
#     (it enables HTTPS; its port mapping is dropped, the mount stays).
#   * only those listen ports take host ports: the services behind nginx
#     are on unix sockets inside the container and the browsers have no
#     DevTools port, so nothing of it sits on the host's loopback.
#   * LISTEN_ADDR selects the address nginx binds directly: unset/empty uses
#     127.0.0.1 (host-local). Set 0.0.0.0 to accept traffic on all IPv4 interfaces.
#   * the docker network settings (NETWORK_NAME / NETWORK_EXTERNAL) do not
#     apply, and PORT_FORWARDS peers are resolved through the host's DNS
#     (there is no docker embedded DNS; container names do not resolve).
#
# This file carries no other settings; everything else stays in compose.yaml.

services:
  browser:
    network_mode: host
    # docker rejects a custom hostname together with the host network
    hostname: !reset null
    # nothing to publish: nginx binds its listen ports on the host directly
    # (!reset also drops ports added by an earlier overlay, e.g. https)
    ports: !reset []
    environment:
      LISTEN_ADDR: "${LISTEN_ADDR:-127.0.0.1}"
      HTTP_PORT: "${HTTP_PORT:-8080}"
      HTTPS_PORT: "${HTTPS_PORT:-8443}"
      CDP_PORT: "${CDP_PORT:-9222}"
