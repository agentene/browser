<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>CDP Console</title>
<style>
  :root {
    --bg:#f7f7f8; --card:#ffffff; --text:#18181b; --muted:#71717a; --line:#e6e6e9;
    --accent:#3563e9; --danger:#d0443e; --chip:#f1f1f3; --thumb:#ececef;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e0f11; --card:#16171a; --text:#ededf0; --muted:#8d8f99; --line:#26272c;
      --accent:#6384ff; --danger:#f2726b; --chip:#202126; --thumb:#202126;
    }
  }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased;
  }
  /* header, error and cards share one centered column, 1168px at most */
  header {
    position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px;
    padding:12px max(16px, calc((100% - 1168px) / 2));
    background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  h1 { font-size:16px; font-weight:600; letter-spacing:-.01em; margin:0; }
  header .new-browser { margin-left:auto; }
  header .settings { margin-left:auto; }
  header .new-browser:not([hidden]) + .settings { margin-left:0; }
  .error:not(:empty) { margin:14px max(16px, calc((100% - 1168px) / 2)) 0; }
  main {
    display:grid; gap:16px; padding:18px max(16px, calc((100% - 1168px) / 2)) 40px; align-items:start;
    grid-template-columns:repeat(auto-fill, minmax(min(100%, 360px), 1fr));
  }

  * { box-sizing:border-box; }
  .spacer { flex:1; }
  .card.hibernated { opacity:.72; cursor:pointer; }
  .summary { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  /* buttons: quiet outlines; the tint comes on hover */
  button {
    font:inherit; font-size:12px; font-weight:500; line-height:18px; border-radius:7px; padding:3px 10px; cursor:pointer;
    border:1px solid var(--line); background:transparent; color:var(--text); white-space:nowrap;
    transition:background .12s, border-color .12s, color .12s;
  }
  button:hover { background:var(--chip); }
  button.danger { color:var(--muted); }
  button.danger:hover {
    color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, transparent);
    background:color-mix(in srgb, var(--danger) 10%, transparent);
  }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:var(--accent); filter:brightness(1.08); }
  button:disabled { opacity:.55; cursor:default; }
  button:focus-visible, .switch:focus-visible, .shot:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* the header's icon buttons: the settings gear (and the panel's close) */
  .settings-btn, button.close {
    display:inline-flex; align-items:center; justify-content:center; flex:none; width:28px; height:28px; padding:0;
    border:none; border-radius:7px; background:transparent; color:var(--muted);
  }
  .settings-btn:hover, .settings-btn[aria-pressed="true"], button.close:hover { background:var(--chip); color:var(--text); }
  /* Settings occupy the content area; only their fields scroll. */
  .settings { flex:none; }
  .settings-page { display:flex; flex:1; flex-direction:column; min-height:0; margin:0; }
  .settings-fields { flex:1; min-height:0; min-width:0; overflow:auto; border:0; padding:0; margin:0; scrollbar-width:thin; }
  .settings-content { display:grid; align-content:start; gap:20px; padding:18px 14px 24px; }
  .settings-title { margin:0; font-weight:600; font-size:15px; outline:none; }
  .settings-footer { display:flex; align-items:center; gap:8px; flex:none; padding:12px 14px; border-top:1px solid var(--line); background:var(--bg); }
  .settings-footer button { padding:5px 10px; }
  .settings-buttons { display:flex; gap:8px; margin-left:auto; }
  .settings-status { flex:none; margin:0; padding:12px 14px 0; color:var(--muted); font-size:13px; }
  .settings-status:empty { display:none; }
  .configuring .summary, .configuring .new-browser, .body[hidden], #cards[hidden] { display:none; }
  .setting > span:first-child { min-width:0; overflow-wrap:anywhere; }
  body.configuring { height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  body.configuring header { flex:none; }
  body.configuring header .new-browser + .settings { margin-left:auto; }
  .settings-content, .settings-footer { padding-left:max(16px, calc((100% - 1168px) / 2)); padding-right:max(16px, calc((100% - 1168px) / 2)); }
  .settings-status:not(:empty) { padding:12px max(16px, calc((100% - 1168px) / 2)) 0; }
  .setting { display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:default; }
  label.setting { cursor:pointer; }
  .setting-hint { display:block; margin-top:2px; color:var(--muted); font-size:12px; }
  .switch {
    appearance:none; -webkit-appearance:none; flex:none; position:relative; width:34px; height:20px; margin:0;
    border-radius:999px; background:color-mix(in srgb, var(--muted) 40%, transparent); cursor:pointer; transition:background .15s;
  }
  .switch::before {
    content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:#fff; box-shadow:0 1px 2px rgb(0 0 0 / 30%); transition:transform .15s;
  }
  .switch:checked { background:var(--accent); }
  .switch:checked::before { transform:translateX(14px); }
  .error:not(:empty) {
    color:var(--danger); font-size:12px; padding:7px 10px; border-radius:8px;
    background:color-mix(in srgb, var(--danger) 9%, transparent);
    border:1px solid color-mix(in srgb, var(--danger) 28%, transparent);
  }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 1px 2px rgb(0 0 0 / 4%);
    display:flex; flex-direction:column; min-width:0; transition:border-color .2s, box-shadow .2s;
  }
  .card-head { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding:12px 14px 0; }
  /* a narrow card wraps its buttons rather than squeezing the name */
  .name {
    font-weight:600; letter-spacing:-.005em; min-width:0; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  /* the swatch: a context's color (--tint), also its browser frame color on the desktop */
  .name::before {
    content:""; display:inline-block; width:9px; height:9px; margin-right:8px; border-radius:3px;
    background:var(--tint, color-mix(in srgb, var(--muted) 45%, transparent));
  }
  .chip {
    background:var(--chip); color:var(--muted); border-radius:999px;
    padding:1px 8px; font-size:11px; font-weight:500; line-height:18px; white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .actions { margin-left:auto; display:flex; align-items:center; gap:6px; }
  .meta { color:var(--muted); font-size:12px; padding:6px 14px 0; font-variant-numeric:tabular-nums; }
  /* current tab (thumbnail, its title across the bottom) | all tabs, as tall as the thumbnail */
  .tabview { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:10px; padding:12px 14px 14px; }
  .shot {
    position:relative; overflow:hidden; cursor:pointer;
    background:var(--thumb); border-radius:8px; border:1px solid var(--line); transition:border-color .12s;
  }
  .shot:hover { border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .thumb { display:block; width:100%; aspect-ratio:16 / 10; object-fit:cover; object-position:top; }
  .thumb:not([src]) { visibility:hidden; }
  /* the current tab's title, on a fade across the thumbnail's bottom */
  .cur-title {
    position:absolute; left:0; right:0; bottom:0; padding:14px 8px 4px;
    background:linear-gradient(transparent, rgb(0 0 0 / 55%)); color:#fff; font-size:11px; font-weight:500;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .cur-title:empty { display:none; }
  /* the browser in front on the desktop: an accent ring, and a live dot on its chip */
  .card.front {
    border-color:color-mix(in srgb, var(--accent) 70%, var(--line));
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .chip.front {
    display:inline-flex; align-items:center; gap:5px;
    background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent);
  }
  .chip.front::before {
    content:""; width:6px; height:6px; border-radius:50%; background:currentColor;
    animation:live 1.6s ease-in-out infinite alternate;
  }
  @keyframes live { from { opacity:.35; } to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .chip.front::before { animation:none; } }
  .tabs-box { position:relative; }
  .tabs {
    position:absolute; inset:0; overflow:auto; list-style:none; margin:0; padding:0;
    display:flex; flex-direction:column; gap:1px; scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  .tabs li { position:relative; min-width:0; flex:none; }
  .tabs button {
    display:flex; align-items:center; gap:6px; width:100%; text-align:left; font-weight:400; padding:3px 8px;
    border:none; border-radius:6px; color:var(--muted);
  }
  .tabs li > button:first-child { min-width:0; }
  .tabs button.tab-close { display:none; position:absolute; right:2px; top:50%; transform:translateY(-50%); width:24px; height:24px; padding:0; justify-content:center; font-size:18px; }
  .tabs li:hover > .tab-close, .tabs li:focus-within > .tab-close { display:flex; }
  .tabs li:hover > button:first-child, .tabs li:focus-within > button:first-child { background:var(--chip); color:var(--text); }
  .tabs li:has(> .tab-close:not([hidden])):is(:hover, :focus-within) > button:first-child { padding-right:28px; }
  @media (hover:none) {
    .tabs button.tab-close { display:flex; }
    .tabs li:has(> .tab-close:not([hidden])) > button:first-child { padding-right:28px; }
  }
  .tabs button.tab-close:hover { color:var(--danger); background:color-mix(in srgb, var(--danger) 10%, transparent); }
  .tabs button.tab-close[hidden], .new-browser[hidden] { display:none; }
  .new-browser { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; padding:0; }
  .tab-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tabs button:hover { background:var(--chip); color:var(--text); }
  .tabs button:focus-visible { outline-offset:-2px; }
  .tabs button.current {
    background:var(--chip); color:var(--text); font-weight:500;
    box-shadow:inset 2px 0 0 var(--accent);
  }
  /* the CDP clients working in a tab: their numbers in the input overlay's colors (overlay.js) */
  .ai-marks { display:inline-flex; align-items:center; gap:3px; flex:none; }
  .ai-marks:empty { display:none; }
  .ai {
    display:inline-flex; align-items:center; gap:4px; padding:0 6px; border-radius:999px;
    background:var(--ai); color:#fff; font-size:10px; font-weight:600; line-height:16px; letter-spacing:.01em;
    white-space:nowrap; font-variant-numeric:tabular-nums; box-shadow:0 1px 3px color-mix(in srgb, var(--ai) 45%, transparent);
  }
  .ai::before {
    content:""; width:5px; height:5px; border-radius:50%; background:currentColor;
    animation:live 1.2s ease-in-out infinite alternate;
  }
  @media (prefers-reduced-motion: reduce) { .ai::before { animation:none; } }
  button.ai { border:none; cursor:pointer; font-family:inherit; }
  button.ai:hover { filter:brightness(1.1); }
  .tabs button.working { color:var(--text); }
  .empty { color:var(--muted); font-size:13px; padding:10px 14px 14px; }
  .settings-page[hidden], .settings-footer [hidden], .setting[hidden], .tabview[hidden], .empty[hidden], .chip[hidden], .actions [hidden] { display:none; }
  /* the console's confirmations (ask()): an in-page overlay, never window.confirm() */
  .ask {
    position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:16px;
    background:color-mix(in srgb, var(--bg) 55%, rgb(0 0 0 / 45%));
  }
  .ask-box {
    width:min(340px, 100%); display:grid; gap:14px; padding:18px 18px 14px; background:var(--card); color:var(--text);
    border:1px solid var(--line); border-radius:12px; box-shadow:0 1px 2px rgb(0 0 0 / 6%), 0 16px 40px rgb(0 0 0 / 28%);
    font-size:13px; line-height:1.5;
  }
  .ask-box p { margin:0; overflow-wrap:anywhere; }
  .ask-buttons { display:flex; justify-content:flex-end; gap:8px; }
  .ask-buttons button { padding:4px 14px; }
  button.danger-solid { background:var(--danger); border-color:var(--danger); color:#fff; }
  button.danger-solid:hover { background:var(--danger); filter:brightness(1.08); }
</style>
</head>
<body>
<header>
  <h1 id="heading">CDP Console</h1>
  <span class="summary" id="summary">loading…</span>
  <button class="settings-btn new-browser" type="button" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="settings">
    <button class="settings-btn" type="button" aria-controls="console-settings" aria-pressed="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>

  </div>
</header>
<div role="alert" class="error" id="error"></div>
<main id="cards"></main>
<form id="console-settings" class="settings-page" aria-labelledby="settings-heading" hidden>
  <p class="settings-status" role="status"></p>
  <fieldset class="settings-fields">
    <div class="settings-content">
      <h3 class="settings-title" id="settings-heading" tabindex="-1"></h3>
    </div>
  </fieldset>
  <footer class="settings-footer">
    <button class="settings-restart danger-solid" type="button" hidden></button>
    <div class="settings-buttons"><button class="settings-save primary" type="submit"></button><button class="settings-cancel" type="button"></button></div>
  </footer>
</form>
<script src="i18n.js"></script>
<script src="settings-ui.js"></script>
<script>
  const cards = document.getElementById('cards');
  const $ = (sel) => document.querySelector(sel);
  // what the gateway pushed over the WebSocket: name -> { ...fields, tabs: Map, current, thumb }
  const browsers = new Map();
  // the tabs the CDP clients work in: [{c, name, id}], c numbering them as
  // the input overlay does — and in its colors (overlay.js' COLORS)
  let working = [];
  const AI_COLORS = ['#7c5cff', '#0ea5e9', '#f43f7a', '#10b981', '#f59e0b', '#ef5a3c'];
  const aiColor = (c) => AI_COLORS[(c - 1) % AI_COLORS.length];
  const views = new Map(); // name -> the card's DOM parts, see liveCard()
  let max = 0;
  let overflow = 'hibernate';
  let actionsEnabled = false;
  let creatingBrowser = false;
  const closingTabs = new Set();
  let serverSettings = {}; // the server-side settings on offer (settings.mjs): {section: {key: value}}

  // The one saved language controls both this interface and browser launches.
  const i18n = window.AgenteneI18n;
  let lang = 'en-US';
  let autoLanguage = 'en-US'; // supplied by the gateway from this viewer's header
  const locale = () => lang;
  const t = (key, ...args) => i18n.t(lang, key, ...args);

  // Static texts here; the cards are rebuilt in the new language.
  function setLang(next) {
    lang = i18n.locale(next);
    document.documentElement.lang = locale();
    document.title = t('title');
    document.getElementById('heading').textContent = t('title');
    renderNewBrowser();
    settingsBtn.title = t('settings');
    settingsBtn.setAttribute('aria-label', t('settings'));
    $('.settings-title').textContent = t('settings');
    $('.settings-save').textContent = t('saveSettings');
    $('.settings-cancel').textContent = t('cancel');
    $('.settings-restart').textContent = t('restartContainer');
    $('.settings-restart').title = t('restartHint');
    settingsEditor.render();
    window.AgenteneAuth?.setLang(lang);
    renderSummary();
    for (const v of views.values()) v.card.remove();
    views.clear();
    browsers.forEach((b, name) => update(name));
  }

  // Settings replace the cards below the header. Ordinary edits stay in a
  // draft until Save; the Access dialogs still save independently.
  const settingsBtn = $('.settings .settings-btn');
  const settingsPage = $('.settings-page');
  const settingsContent = $('.settings-content');
  let settingsOpen = false;
  let settingsBusy = false;
  let settingsOnlyOpened = false;
  const settingsEditor = window.AgenteneSettings.mount({ container: settingsContent, getLang: () => lang, onDirty: renderSave });
  function renderSave() {
    $('.settings-save').disabled = settingsBusy || !settingsEditor.ready() || !settingsEditor.dirty();
  }
  function receiveSettings(view) {
    if (view.autoLanguage) autoLanguage = view.autoLanguage;
    const first = !settingsEditor.ready();
    serverSettings = view;
    if (first && settingsOpen) settingsEditor.open(view); else settingsEditor.update(view);
    const selected = view.values?.browser.language;
    const nextLang = i18n.locale(selected === 'auto' ? autoLanguage : selected);
    if (nextLang !== lang) setLang(nextLang);
    max = view.effective?.contexts.maxRunning ?? max;
    overflow = view.effective?.contexts.overflow ?? overflow;
    if (view.capabilities?.browser === false && !settingsOnlyOpened) {
      settingsOnlyOpened = true;
      setSettings(true);
    }
  }
  let connectionError = false;
  let restarting = false;
  let restartAccepted = false;
  let restartDisconnected = false;
  let restartReady = false;
  let restartTimer = 0;

  function setSettings(open) {
    if (settingsBusy) return;
    settingsOpen = open;
    if (open) settingsEditor.open(serverSettings); else settingsEditor.close();
    settingsPage.hidden = !open;
    cards.hidden = open;
    document.body.classList.toggle('configuring', open);
    settingsBtn.setAttribute('aria-pressed', String(open));
    showError(null);
    $('.settings-status').textContent = '';
    settingsEditor.update(serverSettings);
    if (open) $('.settings-title').focus();
    else settingsBtn.focus();
  }

  function renderRestart() {
    $('.settings-restart').disabled = settingsBusy || ws?.readyState !== WebSocket.OPEN;
  }

  function setSettingsBusy(busy) {
    settingsBusy = busy;
    settingsPage.setAttribute('aria-busy', String(busy));
    $('.settings-fields').disabled = busy;
    for (const b of settingsPage.querySelectorAll('.settings-footer button')) b.disabled = busy;
    settingsBtn.disabled = busy;
    renderRestart();
    renderSave();
  }

  settingsBtn.addEventListener('click', () => setSettings(settingsPage.hidden));
  $('.settings-cancel').addEventListener('click', () => setSettings(false));
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || settingsPage.hidden) return;
    e.preventDefault();
    e.stopPropagation(); // return to the list before closing the sidebar
    setSettings(false);
  });
  settingsPage.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!settingsOpen || settingsBusy) return;
    let savedOk = false;
    setSettingsBusy(true);
    showError(null);
    $('.settings-status').textContent = t('savingSettings');
    try {
      const view = await settingsEditor.save((body) => call('PATCH', 'api/settings', body), ask);
      if (!view) return;
      receiveSettings(view);
      if (Object.keys(view.errors).length) throw new Error(t('settingsApplyFailed'));
      savedOk = true;
    } catch (err) {
      showError(err);
    } finally {
      setSettingsBusy(false);
      $('.settings-status').textContent = savedOk ? t('settingsSaved') : '';
    }
  });

  function finishRestart() {
    if (!restarting || !restartAccepted || !restartReady) return;
    clearTimeout(restartTimer);
    location.reload(); // reload Selkies too, after the new gateway is ready
  }

  $('.settings-restart').addEventListener('click', async () => {
    // An open live connection lets us observe shutdown before reloading.
    if (settingsBusy || ws?.readyState !== WebSocket.OPEN) return;
    restarting = true;
    restartAccepted = restartDisconnected = restartReady = false;
    setSettingsBusy(true);
    showError(null);
    $('.settings-status').textContent = t('restartingContainer');
    restartTimer = setTimeout(() => showError(t('restartTimeout')), 90000);
    try {
      await call('POST', 'api/restart');
      restartAccepted = true;
      settingsOpen = false; // restarting never saves the draft
      finishRestart();
    } catch (err) {
      if (!err.status) {
        // The connection may have gone away after the server accepted it.
        // Wait for recovery, never send the restart a second time.
        restartAccepted = true;
        finishRestart();
        return;
      }
      clearTimeout(restartTimer);
      restarting = false;
      setSettingsBusy(false);
      $('.settings-status').textContent = '';
      showError(err);
    }
  });

  // The built-in login's rows in the settings page (login, CDP API key, log out) and
  // their dialogs: served by the auth service next to the console
  // (ENABLE_AUTH=true; without it the script is not there).
  const authUi = document.createElement('script');
  authUi.src = new URL('../__auth/ui.js', location.href).href;
  authUi.onload = () => {
    window.AgenteneAuth?.setLang(lang);
    window.AgenteneAuth?.mount({ menu: settingsContent, root: document.body, onError: showError });
  };
  document.head.append(authUi);
  // ...and the session keepalive, so an idle console tab stays signed in
  const authKeepalive = document.createElement('script');
  authKeepalive.src = new URL('../__auth/keepalive.js', location.href).href;
  document.head.append(authKeepalive);

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'onclick') node.onclick = v;
      else node.setAttribute(k, v);
    }
    node.append(...children);
    return node;
  }

  // A confirmation of the console's own, never window.confirm(): that one is
  // modal for the whole page and blocks its main thread (the live thumbnails stop with it). This one is an
  // overlay on the page.
  // Resolves true on confirm.
  let asking = null; // the open confirmation's done(), if any
  function ask(message, okLabel) {
    asking?.(false);
    return new Promise((resolve) => {
      const behind = [...document.body.children].filter((n) => n.tagName !== 'SCRIPT' && !n.inert);
      const back = document.activeElement;
      const cancel = el('button', { type: 'button' }, t('cancel'));
      const ok = el('button', { type: 'button', class: 'danger-solid' }, okLabel);
      const layer = el('div', { class: 'ask' },
        el('div', { class: 'ask-box', role: 'alertdialog', 'aria-modal': 'true', 'aria-label': message },
          el('p', {}, message), el('div', { class: 'ask-buttons' }, cancel, ok)));
      const done = (yes) => {
        if (asking !== done) return;
        asking = null;
        layer.remove();
        for (const n of behind) n.inert = false;
        if (back?.isConnected) back.focus();
        resolve(yes);
      };
      asking = done;
      cancel.onclick = () => done(false);
      ok.onclick = () => done(true);
      layer.addEventListener('pointerdown', (e) => { if (e.target === layer) done(false); });
      layer.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          e.stopPropagation(); // closes the confirmation only, not anything behind it
          done(false);
        } else if (e.key === 'Tab') {
          e.preventDefault(); // the focus stays on its two buttons
          (e.target === ok ? cancel : ok).focus();
        }
      });
      for (const n of behind) n.inert = true;
      document.body.append(layer);
      cancel.focus();
    });
  }

  async function call(method, path, body) {
    // X-CDP-Console: the gateway takes no console write without it, which no
    // cross-site form can send (console-auth.mjs)
    const headers = { 'X-CDP-Console': '1', ...(body === undefined ? {} : { 'Content-Type': 'application/json' }) };
    const res = await fetch(path, { method, headers, ...(body === undefined ? {} : { body: JSON.stringify(body) }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { ...data, status: res.status });
    return data;
  }

  function renderNewBrowser() {
    const button = $('.new-browser');
    button.hidden = !actionsEnabled;
    const atLimit = overflow === 'reject' && [...browsers.values()].filter((b) => !b.main && (b.occupied ?? b.state !== 'hibernated')).length >= max;
    button.disabled = creatingBrowser || atLimit;
    button.setAttribute('aria-busy', String(creatingBrowser));
    button.title = t(atLimit ? 'browserLimit' : 'newBrowserHint');
    button.setAttribute('aria-label', t(creatingBrowser ? 'creatingBrowser' : 'newBrowser'));
    if (creatingBrowser) button.title = t('creatingBrowser');
  }

  $('.new-browser').addEventListener('click', async () => {
    if (creatingBrowser) return;
    creatingBrowser = true;
    renderNewBrowser();
    showError('');
    try { await call('POST', 'api/browsers'); }
    catch (err) { showError(err); }
    finally { creatingBrowser = false; renderNewBrowser(); }
  });

  async function closeTab(name, id, button) {
    const key = `${name}/${id}`;
    if (closingTabs.has(key)) return;
    closingTabs.add(key);
    button.disabled = true;
    button.setAttribute('aria-busy', 'true');
    showError('');
    try { await call('DELETE', `api/${encodeURIComponent(name)}/tabs/${encodeURIComponent(id)}`); }
    catch (err) { showError(err); }
    finally {
      closingTabs.delete(key);
      button.disabled = false;
      button.removeAttribute('aria-busy');
    }
  }

  // Switch the browser to a tab and raise its window; highlighted right
  // away, the gateway's next 'current' confirms it.
  function focusTab(name, id) {
    const b = browsers.get(name);
    const before = b?.current;
    if (b?.tabs.has(id)) {
      b.current = id;
      update(name);
    }
    call('POST', `api/${encodeURIComponent(name)}/focus/${encodeURIComponent(id)}`).catch((err) => {
      showError(err);
      if (b && b.current === id) {
        b.current = before;
        update(name);
      }
    });
  }

  // A main browser that is not running (not started yet, closed, crashed):
  // a Start button instead of the tabs.
  function stoppedMainCard(context) {
    const starting = context.state === 'starting';
    const start = el('button', { class: 'primary', title: t('startTitle'),
      onclick: () => {
        start.disabled = true;
        start.textContent = t('starting');
        call('POST', 'api/main/start').catch(showError);
      } }, starting ? t('starting') : t('startBrowser'));
    start.disabled = starting;
    return { card: el('section', { class: 'card' },
      el('div', { class: 'card-head' },
        el('span', { class: 'name' }, t('mainBrowser')),
        el('span', { class: 'chip' }, starting ? t('stateStarting') : t('stateStopped')),
        el('span', { class: 'spacer' }), start),
      el('div', { class: 'empty' }, t('notRunning'))) };
  }

  // The card's fixed parts; fillCard() keeps the changing ones up to date.
  function liveCard(context) {
    const isMain = !!context.main;
    const name = context.name;
    const base = `api/${encodeURIComponent(name)}`;
    const v = { items: new Map(), src: '', shownCurrent: null };
    v.chip = el('span', { class: 'chip' });
    // the clients working in this browser: a click shows their tab
    v.ai = el('span', { class: 'ai-marks' });
    // the browser in front on the desktop shows "Showing" where its Show button was
    v.frontChip = el('span', { class: 'chip front', title: t('frontTitle') }, t('showing'));
    v.show = el('button', { title: t('showTitle'),
      onclick: () => call('POST', `${base}/focus`).catch(showError) }, t('show'));
    // the buttons wrap as one group, right-aligned, when the card gets narrow
    const actions = el('span', { class: 'actions' }, v.frontChip, v.show);
    const head = el('div', { class: 'card-head' },
      el('span', { class: 'name' }, isMain ? t('mainBrowser') : name), v.chip, v.ai,
      actions);
    if (isMain) {
      actions.append(el('button', { class: 'danger', title: t('stopTitle'),
        onclick: async () => await ask(t('stopConfirm'), t('stop'))
          && call('POST', `${base}/stop`).catch(showError) }, t('stop')));
    }
    if (!isMain) {
      v.hibernate = el('button', {
        onclick: async () => await ask(t('hibernateConfirm'), t('hibernate'))
          && call('POST', `${base}/hibernate`).catch(showError) }, t('hibernate'));
      actions.append(v.hibernate);
      actions.append(el('button', { class: 'danger', title: t('deleteTitle'),
        onclick: async () => await ask(t('deleteConfirm', name), t('delete'))
          && call('DELETE', base).catch(showError) }, t('delete')));
    }
    v.meta = el('div', { class: 'meta' });
    v.img = el('img', { class: 'thumb', alt: '' });
    v.title = el('div', { class: 'cur-title' });
    const shot = el('div', { class: 'shot', title: t('shotTitle') }, v.img, v.title);
    shot.onclick = () => {
      const current = browsers.get(name)?.current;
      if (current) focusTab(name, current);
    };
    v.list = el('ul', { class: 'tabs' });
    v.tabview = el('div', { class: 'tabview' }, shot, el('div', { class: 'tabs-box' }, v.list));
    v.empty = el('div', { class: 'empty' }, t('noTabs'));
    // a context's color (the swatch by its name) is also its browser frame color on the desktop
    v.card = el('section', { class: 'card', ...(context.color ? { style: `--tint:${context.color}` } : {}) },
      head, v.meta, v.tabview, v.empty);
    v.card.addEventListener('click', (event) => {
      if (browsers.get(name)?.state === 'hibernated' && !event.target.closest('button')) {
        call('POST', `${base}/focus`).catch(showError);
      }
    });
    return v;
  }

  // Bring a card in line with its state, touching only what changed (no
  // flicker, focus and list scroll position stay).
  function fillCard(context, v) {
    const n = context.tabs.size;
    const state = context.state ?? 'running';
    const sleeping = state === 'hibernated';
    const pending = !['running', 'hibernated'].includes(state);
    const stateKey = { starting: 'stateStarting', hibernated: 'stateHibernated', hibernating: 'stateHibernating', waking: 'stateWaking', destroying: 'stateDestroying' }[state];
    v.chip.textContent = stateKey ? `${t(stateKey)} · ${t('tabs', n)}` : t('tabs', n);
    v.card.classList.toggle('hibernated', sleeping);
    v.show.textContent = t(sleeping ? 'wake' : 'show');
    v.show.disabled = pending;
    if (v.hibernate) {
      v.hibernate.hidden = !actionsEnabled || state !== 'running';
      v.hibernate.disabled = !!context.blockedReason;
      v.hibernate.title = context.blockedReason || t('hibernate');
    }
    // the browser the desktop (and the Selkies stream) shows in front
    v.card.classList.toggle('front', !!context.front);
    v.frontChip.hidden = !context.front;
    v.show.hidden = !!context.front;
    v.meta.textContent = context.main
      ? t('mainMeta')
      : t('contextMeta', context.client, new Date(context.createdAt).toLocaleTimeString(locale()), context.pid ?? '—');
    if (context.hibernatedAt) v.meta.textContent += ` · ${t('stateHibernated')} ${new Date(context.hibernatedAt).toLocaleTimeString(locale())}`;
    if (context.lastError || context.restoreWarning) v.meta.textContent += ` · ${context.lastError || context.restoreWarning}`;
    v.tabview.hidden = !n;
    v.empty.hidden = !!n;
    for (const [id, li] of v.items) {
      if (context.tabs.has(id)) continue;
      if (li.contains(document.activeElement)) {
        (li.nextElementSibling?.firstChild ?? li.previousElementSibling?.firstChild ?? $('.new-browser')).focus();
      }
      li.remove();
      v.items.delete(id);
    }
    for (const tab of context.tabs.values()) {
      let li = v.items.get(tab.id);
      if (!li) {
        li = el('li', {}, el('button', { type: 'button', onclick: () => focusTab(context.name, tab.id) },
          el('span', { class: 'tab-title' }), el('span', { class: 'ai-marks' })),
          el('button', { type: 'button', class: 'tab-close',
            onclick: (event) => closeTab(context.name, tab.id, event.currentTarget) }, '×'));
        v.items.set(tab.id, li);
        v.list.append(li);
      }
      const button = li.firstChild;
      const [label, marks] = button.children;
      const title = tab.title || t('untitled');
      const close = li.lastChild;
      close.hidden = !actionsEnabled;
      close.disabled = sleeping || pending || closingTabs.has(`${context.name}/${tab.id}`);
      close.setAttribute('aria-label', t('closeTab', title));
      if (label.textContent !== title) label.textContent = title;
      const here = working.filter((w) => w.name === context.name && w.id === tab.id).map((w) => w.c);
      fillMarks(marks, here, (c) => el('span', { class: 'ai', style: `--ai:${aiColor(c)}` }, `AI #${c}`));
      button.classList.toggle('working', here.length > 0);
      button.title = [tab.url, ...here.map((c) => t('aiWorking', c))].join('\n');
      button.classList.toggle('current', tab.id === context.current);
    }
    const mine = working.filter((w) => w.name === context.name && context.tabs.has(w.id));
    fillMarks(v.ai, mine.map((w) => w.c), (c) => el('button', {
      type: 'button', class: 'ai', style: `--ai:${aiColor(c)}`, title: t('aiShow', c),
      onclick: () => {
        const w = working.find((x) => x.c === c && x.name === context.name);
        if (w) focusTab(context.name, w.id);
      },
    }, `AI #${c}`));
    const current = context.tabs.get(context.current);
    v.title.textContent = current ? current.title || t('untitled') : '';
    v.title.title = current?.url ?? '';
    // the thumbnail of the tab before stays out until the new one's arrives
    const thumb = context.thumb?.id === context.current ? `data:image/jpeg;base64,${context.thumb.jpeg}` : '';
    if (thumb !== v.src) {
      v.src = thumb;
      if (thumb) v.img.src = thumb;
      else v.img.removeAttribute('src');
    }
    if (context.current !== v.shownCurrent) {
      v.shownCurrent = context.current;
      const li = v.items.get(context.current);
      const top = v.list.scrollTop;
      if (li && (li.offsetTop < top || li.offsetTop + li.offsetHeight > top + v.list.clientHeight)) {
        v.list.scrollTop = li.offsetTop - 4;
      }
    }
  }

  // A set of AI marks, rebuilt only when its numbers change.
  function fillMarks(box, cs, make) {
    const key = cs.join(',');
    if (box.dataset.cs === key) return;
    box.dataset.cs = key;
    box.replaceChildren(...cs.map(make));
  }

  function update(name) {
    const context = browsers.get(name);
    let v = views.get(name);
    if (!context) {
      v?.card.remove();
      views.delete(name);
      return;
    }
    const kind = context.main && context.state !== 'running' ? `main-${context.state}` : 'live';
    if (v?.kind !== kind) {
      const fresh = kind === 'live' ? liveCard(context) : stoppedMainCard(context);
      fresh.kind = kind;
      if (v) v.card.replaceWith(fresh.card);
      else if (context.main) cards.prepend(fresh.card);
      else cards.append(fresh.card);
      views.set(name, v = fresh);
    }
    if (kind === 'live') fillCard(context, v);
  }

  // Apply one op of the gateway's protocol (gateway.mjs, "console live
  // state"); returns the names of the browsers it touched.
  function apply(op) {
    if (op.t === 'snapshot') {
      max = op.max;
      overflow = op.overflow ?? 'reject';
      receiveSettings(op.settings ?? {});
      browsers.clear();
      views.clear();
      cards.replaceChildren();
      for (const b of op.browsers) browsers.set(b.name, { ...b, tabs: new Map(b.tabs.map((t) => [t.id, t])) });
      working = op.ai ?? [];
      return [...browsers.keys()];
    }
    if (op.t === 'settings') {
      receiveSettings(op.settings);
      return [];
    }
    if (op.t === 'ai') {
      const touched = new Set([...working, ...op.ai].map((w) => w.name));
      working = op.ai;
      return [...touched].filter((name) => browsers.has(name));
    }
    if (op.t === 'gone') {
      browsers.delete(op.name);
      return [op.name];
    }
    let b = browsers.get(op.name);
    if (!b) browsers.set(op.name, b = { name: op.name, tabs: new Map(), current: null, thumb: null });
    if (op.t === 'browser') {
      const { t, ...fields } = op;
      Object.assign(b, fields);
    } else if (op.t === 'tabs') {
      for (const tab of op.set) b.tabs.set(tab.id, tab);
      for (const id of op.del) b.tabs.delete(id);
    } else if (op.t === 'current') {
      b.current = op.id;
    } else if (op.t === 'thumb') {
      b.thumb = { id: op.id, jpeg: op.jpeg };
    }
    return [op.name];
  }

  function renderSummary() {
    renderNewBrowser();
    const n = [...browsers.values()].filter((b) => !b.main && (b.occupied ?? b.state !== 'hibernated')).length;
    const sleeping = [...browsers.values()].filter((b) => b.state === 'hibernated').length;
    document.getElementById('summary').textContent = connected ? t('summary', n, max, sleeping) : t('loading');
  }

  function showError(err, connection = false) {
    connectionError = connection;
    document.getElementById('error').textContent = err ? String(err.message || err) : '';
  }

  // Live state over a WebSocket next to this page (/console/ws): a snapshot,
  // then only changes. Reconnects with backoff — while the page is visible:
  // a subscriber keeps the gateway's once-a-second tick going (every tab of
  // every browser probed, screencasts for the thumbnails), so a console left
  // open in a background tab disconnects and picks up a fresh snapshot when
  // it is shown again.
  let retry = 1000;
  let connected = false; // a snapshot has arrived
  let ws = null;
  let retryTimer = 0;
  function connect() {
    if (ws || (document.hidden && !restarting)) return;
    const url = new URL('ws', location.href);
    url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(url);
    ws.onopen = () => {
      retry = 1000;
      renderRestart();
      if (!restarting && (connectionError || !settingsOpen)) showError(null);
    };
    ws.onmessage = (e) => {
      const touched = new Set();
      let snapshot = false;
      for (const op of JSON.parse(e.data).ops) {
        if (op.t === 'snapshot') snapshot = true;
        for (const name of apply(op)) touched.add(name);
      }
      connected = true;
      touched.forEach(update);
      renderSummary();
      settingsEditor.update(serverSettings);
      if (restarting && restartDisconnected && snapshot) {
        restartReady = true;
        finishRestart();
      }
    };
    ws.onclose = () => {
      ws = null;
      renderRestart();
      if (restarting) restartDisconnected = true;
      else showError(t('reconnecting', retry / 1000), true);
      retryTimer = setTimeout(connect, retry);
      retry = Math.min(retry * 2, 10000);
    };
  }

  function disconnect() {
    clearTimeout(retryTimer);
    if (!ws) return;
    ws.onclose = null;
    ws.close();
    ws = null;
    renderRestart();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (!restarting) disconnect();
    } else {
      retry = 1000;
      connect();
    }
  });

  // Resolve Auto from HTTP, just like the browser launch actions. A WebSocket
  // may send a different header. Keep any newer live state when this read ends.
  call('GET', 'api/settings').then((view) => {
    receiveSettings(settingsEditor.ready() ? { ...serverSettings, autoLanguage: view.autoLanguage } : view);
  }).catch(showError);

  call('GET', 'api/browsers').then((data) => {
    actionsEnabled = data.enabled;
    renderNewBrowser();
    browsers.forEach((b, name) => update(name));
  }).catch(showError);

  call('GET', 'api/restart').then((data) => {
    $('.settings-restart').hidden = !data.enabled;
    renderRestart();
  }).catch(showError);

  setLang(lang);
  connect();
</script>
</body>
</html>
